[package]
name = "varak"
version = "0.13.1"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "tiff", "bmp"] }
