# Varak'ı Windows'ta depodaki kaynaktan derler ve taşınabilir ZIP'i üretir.
# "v" ile başlayan bir sürüm etiketi (ör. v0.13.0) gönderildiğinde ZIP, Releases sayfasına da konur.
name: Derle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Araçları, dil modellerini, yazı tiplerini ve lisans metinlerini indir
        shell: cmd
        run: kurulum.bat

      - name: Derle ve ZIP'i hazırla
        shell: cmd
        run: derle.bat

      - name: Derleme günlüğü (hata olursa)
        if: failure()
        shell: cmd
        run: type derleme_log.txt

      - name: ZIP'i iş çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: Varak
          path: dagitim/Varak-*.zip

      - name: Sürüm sayfasına ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dagitim/Varak-*.zip
